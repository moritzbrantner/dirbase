name: Benchmarks

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/benchmark*"
      - "scripts/moonlight*.sh"
      - "scripts/runtime-profile.sh"
      - "scripts/run_query_correctness.py"
      - "scripts/run_write_benchmark.py"
      - "benchmarks/**"
      - "profiles/runtime-profiler/**"
      - ".github/workflows/benchmarks.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      duration:
        description: "autocannon duration in seconds"
        required: false
        default: "10"
      connections:
        description: "autocannon concurrent connections"
        required: false
        default: "50"
      runs:
        description: "repeated runs per scenario and mode"
        required: false
        default: "3"
      warmup_duration:
        description: "warm-up duration in seconds"
        required: false
        default: "3"
      warmup_connections:
        description: "warm-up concurrent connections"
        required: false
        default: "1"
      baseline_ref:
        description: "Optional git ref to compare against the current checkout with Moonlight"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Run JSON Server parity benchmark
        env:
          DURATION: ${{ github.event_name == 'pull_request' && '1' || inputs.duration || '10' }}
          CONNECTIONS: ${{ github.event_name == 'pull_request' && '4' || inputs.connections || '50' }}
          RUNS: ${{ github.event_name == 'pull_request' && '1' || inputs.runs || '3' }}
          WARMUP_DURATION: ${{ github.event_name == 'pull_request' && '1' || inputs.warmup_duration || '3' }}
          WARMUP_CONNECTIONS: ${{ inputs.warmup_connections || '1' }}
          SKIP_WRITE_BENCHMARKS: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: bash scripts/benchmark_vs_json_server.sh

      - name: Find latest summary file
        id: latest-summary
        run: |
          latest_summary="$(ls -1t benchmarks/results/benchmark-summary-*.json | head -n 1)"
          latest_stamp="${latest_summary##*benchmark-summary-}"
          latest_stamp="${latest_stamp%.json}"
          report_file="benchmarks/results/benchmark-report-${latest_stamp}.md"
          echo "summary=${latest_summary}" >> "$GITHUB_OUTPUT"
          echo "report=${report_file}" >> "$GITHUB_OUTPUT"

      - name: Publish report to job summary
        run: cat "${{ steps.latest-summary.outputs.report }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize benchmark result
        run: python3 scripts/summarize_benchmark_result.py --summary "${{ steps.latest-summary.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            benchmarks/results/*.json
            benchmarks/results/*.md
            benchmarks/.work/*.log
            benchmarks/.work/*.tsv
          if-no-files-found: ignore

  runtime-evidence:
    if: github.event_name != 'pull_request'
    needs: run-benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout dirbase
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Checkout runtime-profiler
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: moritzbrantner/runtime-profiler
          path: .tools/runtime-profiler
          persist-credentials: false

      - name: Capture parity smoke evidence
        env:
          RUNTIME_PROFILER_ROOT: ${{ github.workspace }}/.tools/runtime-profiler
        run: bash scripts/runtime-profile.sh ".artifacts/runtime-profiler/parity-${GITHUB_RUN_ID}"

      - name: Render runtime evidence summary
        env:
          RUNTIME_PROFILER_ROOT: ${{ github.workspace }}/.tools/runtime-profiler
        run: |
          cargo run --quiet --manifest-path "$RUNTIME_PROFILER_ROOT/Cargo.toml" -- \
            summarize --bundle ".artifacts/runtime-profiler/parity-${GITHUB_RUN_ID}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-evidence-${{ github.run_id }}
          path: .artifacts/runtime-profiler/
          if-no-files-found: ignore

  moonlight-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.baseline_ref != ''
    needs: run-benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Checkout baseline
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.baseline_ref }}
          path: .benchmark-baseline
          persist-credentials: false

      - name: Checkout Moonlight
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: moritzbrantner/moonlight
          path: .tools/moonlight
          persist-credentials: false

      - name: Compare baseline and candidate
        env:
          MOONLIGHT_ROOT: ${{ github.workspace }}/.tools/moonlight
        run: |
          mkdir -p .artifacts
          bash scripts/moonlight-compare.sh \
            "$GITHUB_WORKSPACE/.benchmark-baseline" \
            "$GITHUB_WORKSPACE" \
            | tee .artifacts/moonlight-parity.txt

      - name: Publish Moonlight result
        if: always()
        run: |
          if [[ -f .artifacts/moonlight-parity.txt ]]; then
            cat .artifacts/moonlight-parity.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Moonlight result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moonlight-parity-${{ github.run_id }}
          path: .artifacts/moonlight-parity.txt
          if-no-files-found: ignore
