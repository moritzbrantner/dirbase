name: Coverage

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9e57365e36de1e26dea5145e57d471261468d9f7

      - name: Generate baseline Rust coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/dirbase-coverage-baseline"
          mkdir -p "$baseline_dir"

          restore_head() {
            git checkout --detach "$HEAD_SHA"
          }
          trap restore_head EXIT

          git checkout --detach "$BASE_SHA"
          cargo llvm-cov clean --workspace
          cargo llvm-cov --all-features --no-report -- --test-threads=1
          cargo llvm-cov report --lcov --output-path "$baseline_dir/lcov.info"
          cargo llvm-cov report --json --output-path "$baseline_dir/coverage.json"

          restore_head
          trap - EXIT

      - name: Generate Rust coverage
        run: |
          set -euo pipefail
          cargo llvm-cov clean --workspace
          cargo llvm-cov --all-features --no-report -- --test-threads=1
          mkdir -p target/llvm-cov
          cargo llvm-cov report --lcov --output-path target/llvm-cov/lcov.info
          cargo llvm-cov report --json --output-path target/llvm-cov/coverage.json

          baseline_dir="$RUNNER_TEMP/dirbase-coverage-baseline"
          if [[ -f "$baseline_dir/lcov.info" ]]; then
            cp "$baseline_dir/lcov.info" target/llvm-cov/baseline.info
            cp "$baseline_dir/coverage.json" target/llvm-cov/baseline.json
          fi

      - name: Summarize Rust coverage
        run: |
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import json
          import os

          root = Path.cwd().resolve()
          coverage_dir = Path("target/llvm-cov")

          def load_report(path):
              payload = json.loads(path.read_text(encoding="utf-8"))
              return payload["data"][0]

          def relative_name(filename):
              path = Path(filename)
              try:
                  return path.resolve().relative_to(root).as_posix()
              except ValueError:
                  marker = "/src/"
                  normalized = path.as_posix()
                  if marker in normalized:
                      return "src/" + normalized.split(marker, 1)[1]
                  return normalized

          def is_production_source(name):
              return (
                  name.startswith("src/")
                  and not name.endswith("_test.rs")
                  and not name.startswith("src/test_support/")
              )

          def metric(summary, name):
              values = summary[name]
              return int(values["covered"]), int(values["count"]), float(values["percent"])

          def format_metric(values):
              covered, total, percent = values
              return f"{covered}/{total} ({percent:.2f}%)"

          def covered_delta(before, after):
              return after[0] - before[0]

          def load_function_hits(path):
              hits = defaultdict(int)
              current_file = None
              for line in path.read_text(encoding="utf-8").splitlines():
                  if line.startswith("SF:"):
                      current_file = relative_name(line[3:])
                  elif line == "end_of_record":
                      current_file = None
                  elif current_file and is_production_source(current_file) and line.startswith("FNDA:"):
                      count, name = line[5:].split(",", 1)
                      hits[(current_file, name)] += int(count)
              return hits

          current = load_report(coverage_dir / "coverage.json")
          baseline_path = coverage_dir / "baseline.json"
          baseline = load_report(baseline_path) if baseline_path.exists() else None

          metric_names = (("Lines", "lines"), ("Regions", "regions"), ("Functions", "functions"))
          current_totals = {label: metric(current["totals"], key) for label, key in metric_names}

          print("Rust coverage:")
          for label, values in current_totals.items():
              print(f"  {label.lower()}: {format_metric(values)}")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path:
              raise SystemExit(0)

          with open(summary_path, "a", encoding="utf-8") as summary:
              summary.write("### Rust coverage\n\n")

              if baseline is None:
                  summary.write("| Metric | Covered | Total | Coverage |\n")
                  summary.write("| --- | ---: | ---: | ---: |\n")
                  for label, values in current_totals.items():
                      covered, total, percent = values
                      summary.write(f"| {label} | {covered} | {total} | {percent:.2f}% |\n")
                  summary.write("\n")
              else:
                  baseline_totals = {
                      label: metric(baseline["totals"], key) for label, key in metric_names
                  }
                  summary.write(
                      "Coverage is measured once at the pull-request base and once at the head. "
                      "Covered-code deltas are kept separate from LCOV execution-count deltas so an "
                      "endpoint test cannot be mistaken for new source coverage when it only exercises "
                      "an already-covered path under a new response mode.\n\n"
                  )
                  summary.write("| Metric | Base | Head | Δ covered |\n")
                  summary.write("| --- | ---: | ---: | ---: |\n")
                  for label, _ in metric_names:
                      before = baseline_totals[label]
                      after = current_totals[label]
                      delta = covered_delta(before, after)
                      summary.write(
                          f"| {label} | {format_metric(before)} | {format_metric(after)} | {delta:+d} |\n"
                      )
                  summary.write("\n")

                  def source_metrics(report):
                      result = {}
                      for file_report in report["files"]:
                          name = relative_name(file_report["filename"])
                          if not is_production_source(name):
                              continue
                          file_summary = file_report["summary"]
                          result[name] = {
                              label: metric(file_summary, key) for label, key in metric_names
                          }
                      return result

                  before_files = source_metrics(baseline)
                  after_files = source_metrics(current)
                  changed = []
                  for name in sorted(set(before_files) & set(after_files)):
                      deltas = {
                          label: covered_delta(before_files[name][label], after_files[name][label])
                          for label, _ in metric_names
                      }
                      if any(deltas.values()):
                          changed.append((name, deltas, after_files[name]))

                  summary.write("#### Production-source coverage deltas\n\n")
                  if changed:
                      summary.write("| Source | Lines Δ | Regions Δ | Functions Δ | Head regions |\n")
                      summary.write("| --- | ---: | ---: | ---: | ---: |\n")
                      for name, deltas, after in changed:
                          summary.write(
                              f"| `{name}` | {deltas['Lines']:+d} | {deltas['Regions']:+d} | "
                              f"{deltas['Functions']:+d} | {format_metric(after['Regions'])} |\n"
                          )
                  else:
                      summary.write("No newly covered production source was detected.\n")
                  summary.write("\n")

                  baseline_lcov = coverage_dir / "baseline.info"
                  current_lcov = coverage_dir / "lcov.info"
                  if baseline_lcov.exists():
                      before_hits = load_function_hits(baseline_lcov)
                      after_hits = load_function_hits(current_lcov)
                      function_deltas = []
                      file_deltas = defaultdict(lambda: [0, 0])
                      for key in set(before_hits) | set(after_hits):
                          delta = after_hits.get(key, 0) - before_hits.get(key, 0)
                          if delta <= 0:
                              continue
                          source, function = key
                          function_deltas.append((delta, source, function))
                          file_deltas[source][0] += 1
                          file_deltas[source][1] += delta

                      summary.write("#### Production-source execution deltas\n\n")
                      summary.write(
                          "These LCOV hit-count deltas show which already-instrumented production paths "
                          "the added test executes more often; they are evidence of test-path impact, not "
                          "a claim that the code became newly covered.\n\n"
                      )
                      if file_deltas:
                          summary.write("| Source | Functions with more hits | Additional function hits |\n")
                          summary.write("| --- | ---: | ---: |\n")
                          for source, (functions, hits) in sorted(file_deltas.items()):
                              summary.write(f"| `{source}` | {functions} | +{hits} |\n")

                          summary.write("\n<details><summary>Changed function hit counts</summary>\n\n")
                          summary.write("| Source | Function | Δ executions |\n")
                          summary.write("| --- | --- | ---: |\n")
                          for delta, source, function in sorted(
                              function_deltas, key=lambda row: (-row[0], row[1], row[2])
                          )[:30]:
                              safe_function = function.replace("|", "\\|")
                              summary.write(f"| `{source}` | `{safe_function}` | +{delta} |\n")
                          summary.write("\n</details>\n")
                      else:
                          summary.write("No positive production function hit-count deltas detected.\n")
                      summary.write("\n")
          PY

      - name: Generate UI coverage
        run: bun run test:coverage
        working-directory: ui

      - name: Validate test coverage matrix
        run: python3 scripts/render_test_matrix.py --check

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: |
            target/llvm-cov/*.info
            target/llvm-cov/*.json
            ui/coverage/**
          if-no-files-found: ignore
