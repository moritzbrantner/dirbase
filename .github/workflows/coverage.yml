name: Coverage

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9e57365e36de1e26dea5145e57d471261468d9f7

      - name: Generate Rust coverage
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --all-features --lcov --output-path target/llvm-cov/lcov.info -- --test-threads=1

      - name: Generate UI coverage
        run: bun run test:coverage
        working-directory: ui

      - name: Validate test coverage matrix
        run: python3 scripts/render_test_matrix.py --check

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: |
            target/llvm-cov/lcov.info
            ui/coverage/**
          if-no-files-found: ignore
