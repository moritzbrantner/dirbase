name: Dependency Security

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          js-deps: "true"

      - name: Install cargo-deny
        uses: taiki-e/install-action@9e57365e36de1e26dea5145e57d471261468d9f7

      - name: Install cargo-audit
        uses: taiki-e/install-action@9e57365e36de1e26dea5145e57d471261468d9f7

      - name: Check Rust dependency policy
        run: cargo deny check advisories bans sources licenses

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Audit UI dependencies
        run: bun audit --audit-level=moderate
        working-directory: ui

      - name: Audit JavaScript package dependencies
        run: bun audit --audit-level=moderate
        working-directory: js
