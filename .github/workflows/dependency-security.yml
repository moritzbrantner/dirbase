name: Dependency Security

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          js-deps: "true"

      - name: Install cargo-deny
        uses: taiki-e/install-action@b973825fbfcd4b824690c4c974a257790eae84a1

      - name: Install cargo-audit
        uses: taiki-e/install-action@81313212648f71da8e15fd1ace469e89d449e63b

      - name: Check Rust dependency policy
        run: cargo deny check advisories bans sources licenses

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Audit UI dependencies
        run: bun audit --audit-level=moderate
        working-directory: ui

      - name: Audit JavaScript package dependencies
        run: bun audit --audit-level=moderate
        working-directory: js
