name: Rust Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Run tests
        run: |
          rm -rf ui/dist
          DIRBASE_REBUILD_UI=1 cargo test --all-features --verbose -- --test-threads=1
