name: rust-package-publish

on:
  push:
    tags:
      - 'bun-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_key: linux-x64
          - os: macos-13
            platform_key: darwin-x64
          - os: macos-latest
            platform_key: darwin-arm64
          - os: windows-latest
            platform_key: win32-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: js
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          rust-toolchain: stable

      - name: Build Rust binary
        run: cargo build --release --manifest-path ../Cargo.toml

      - name: Copy platform binary
        run: bun scripts/copy-rust-binary.mjs
        env:
          TARGET_PLATFORM_KEY: ${{ matrix.platform_key }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dirbase-${{ matrix.platform_key }}
          path: js/bin/${{ matrix.platform_key }}

  publish:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          rust: "false"
          cargo-cache: "false"
          ui-deps: "false"
          js-deps: "true"

      - name: Build JavaScript bundle
        run: bun run build:js

      - name: Download binary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: js/bin
          pattern: dirbase-*
          merge-multiple: true

      - name: Generate binary checksums
        run: |
          find bin -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > bin/SHA256SUMS

      - name: Publish package
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
